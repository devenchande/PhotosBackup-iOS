name: release-ipa

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The whole point of building here is that a release binary can be tied
      # to the commit AND the toolchain it claims. Falling back to whatever the
      # runner image ships would quietly break that, so a missing pin fails the
      # build instead: bump the version here deliberately when it is retired.
      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner. Available:"
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version
        env:
          XCODE_APP: /Applications/Xcode_26.3.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: Scripts/make-ipa.sh

      # Name the IPA after the version it carries (PhotosBackup-iOS-0.3.10.ipa), so
      # a downloaded file says which build it is. The version comes from
      # project.yml, the value baked into the app; on a release it must match
      # the tag, or the IPA would be attached under a version it is not.
      - name: Name the IPA after its version
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' project.yml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::Could not read MARKETING_VERSION from project.yml"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "release" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.yml"
            exit 1
          fi
          ipa="build/PhotosBackup-iOS-$version.ipa"
          mv build/PhotosBackup.ipa "$ipa"
          echo "IPA=$ipa" >> "$GITHUB_ENV"
          echo "Named the IPA $ipa"

      - name: Checksum
        run: |
          shasum -a 256 "$IPA" | awk '{print $1}' > "$IPA.sha256"
          echo "sha256: $(cat "$IPA.sha256")"

      - name: Attach IPA and checksum to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$IPA" "$IPA.sha256" --clobber
          echo "Attached $IPA to release $GITHUB_REF_NAME"

      - name: Upload workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PhotosBackup-ipa
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
          if-no-files-found: error
